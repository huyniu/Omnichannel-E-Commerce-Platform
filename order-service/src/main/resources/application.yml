server:
  port: 8083
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:order_svc}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      observation-enabled: true
    template:
      observation-enabled: true

grpc:
  client:
    product-service:
      address: ${PRODUCT_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
      enable-keep-alive: true

order:
  payment-timeout: ${ORDER_PAYMENT_TIMEOUT:15m}
  shipping-fee: 30000
  free-shipping-from: 500000
  max-quantity-per-sku: ${ORDER_MAX_QTY_PER_SKU:10}
  lock-wait: ${ORDER_LOCK_WAIT:3s}
  lock-lease: ${ORDER_LOCK_LEASE:10s}
  product-deadline-ms: 2000

outbox:
  poll-interval-ms: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
