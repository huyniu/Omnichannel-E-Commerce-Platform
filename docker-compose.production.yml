# Production stack on the VPS. Images are built by GitHub Actions and pulled from GHCR.
#   docker compose -f docker-compose.production.yml --env-file .env up -d
#
# Security model:
#   * Every container lives on the private "backend-network"; NO database / broker port is published.
#   * Only the API Gateway is published, and only on 127.0.0.1 -> reachable solely through host Nginx (TLS).
#     (Docker writes its own iptables rules and bypasses UFW for published ports, so binding to 127.0.0.1
#     is what actually keeps services off the Internet.)

name: omni

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-java-service: &java-service
  restart: always
  logging: *logging
  networks: [backend-network]
  deploy:
    resources:
      limits:
        memory: 512M
  environment: &common-env
    JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
    OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    TRACING_SAMPLING: ${TRACING_SAMPLING:-0.1}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
    networks: [backend-network]

  mongo:
    image: mongo:7.0
    restart: always
    logging: *logging
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 20
    networks: [backend-network]

  redis:
    image: redis:7.4-alpine
    restart: always
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [backend-network]

  kafka:
    image: apache/kafka:3.8.0
    restart: always
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [backend-network]

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in order.events payment.events order.events.DLT payment.events.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"
    networks: [backend-network]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: always
    logging: *logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
    networks: [backend-network]

  api-gateway:
    <<: *java-service
    image: ${REGISTRY}/omni-api-gateway:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      IDENTITY_URI: http://identity-service:8081
      PRODUCT_URI: http://product-service:8082
      ORDER_URI: http://order-service:8083
      PAYMENT_URI: http://payment-service:8084
      NOTIFICATION_URI: http://notification-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_REPLENISH: ${RATE_LIMIT_REPLENISH:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }

  identity-service:
    <<: *java-service
    image: ${REGISTRY}/omni-identity-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres: { condition: service_healthy }

  product-service:
    <<: *java-service
    image: ${REGISTRY}/omni-product-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      MONGO_URI: mongodb://mongo:27017/product_db
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
    depends_on:
      mongo: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  order-service:
    <<: *java-service
    image: ${REGISTRY}/omni-order-service:${IMAGE_TAG:-latest}
    deploy:
      resources:
        limits:
          memory: 768M
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCT_GRPC_ADDRESS: static://product-service:9090
      ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-15m}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment-service:
    <<: *java-service
    image: ${REGISTRY}/omni-payment-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      DB_HOST: postgres
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      MOCK_GATEWAY_ENABLED: ${MOCK_GATEWAY_ENABLED:-false}
      MOCK_GATEWAY_SECRET: ${MOCK_GATEWAY_SECRET:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  notification-service:
    <<: *java-service
    image: ${REGISTRY}/omni-notification-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      MONGO_URI: mongodb://mongo:27017/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@omni.local}
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

networks:
  backend-network:
    name: backend-network

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
  es-data:
