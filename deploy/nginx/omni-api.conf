# /etc/nginx/sites-available/omni-api.conf  (symlink into sites-enabled)
# Host-level reverse proxy in front of the API Gateway container (published on 127.0.0.1:8080).
# After the first `nginx -t && systemctl reload nginx`, run:
#   sudo certbot --nginx -d api.example.com
# Certbot adds the 443 server block + certificates and turns this block into an HTTP->HTTPS redirect.

# Coarse per-IP protection at the edge; fine-grained per-user limits live in the gateway (Redis).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=200r/s;

upstream omni_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;        # <-- your domain

    client_max_body_size 5m;

    # Actuator (metrics, env...) must never be public; only expose the health probe.
    location ~ ^/actuator/(?!health) {
        return 404;
    }

    location / {
        limit_req zone=api_per_ip burst=400 nodelay;
        limit_req_status 429;

        proxy_pass http://omni_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
