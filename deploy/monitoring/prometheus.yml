global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }
      - targets: ["identity-service:8081"]
        labels: { service: identity-service }
      - targets: ["product-service:8082"]
        labels: { service: product-service }
      - targets: ["order-service:8083"]
        labels: { service: order-service }
      - targets: ["payment-service:8084"]
        labels: { service: payment-service }
      - targets: ["notification-service:8085"]
        labels: { service: notification-service }
