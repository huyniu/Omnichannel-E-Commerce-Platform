server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      # Spring log line: "INFO [order-service,<traceId>,<spanId>] ..." -> extract traceId for Loki->Jaeger links
      - regex:
          expression: '\[(?P<app>[^,\]]*),(?P<traceId>[0-9a-f]*),(?P<spanId>[0-9a-f]*)\]'
      - labels:
          app:
